name: InspireMe
options:
  bundleIdPrefix: pe.kr.advenoh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 3PLL9LS3T3

schemes:
  InspireMe:
    build:
      targets:
        InspireMe: all
    run:
      config: Debug
    archive:
      config: Release
      revealArchiveInOrganizer: true

targets:
  InspireMe:
    type: application
    platform: iOS
    sources:
      - path: InspireMe
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.kr.advenoh.inspireme
        GENERATE_INFOPLIST_FILE: true
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: true
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        CODE_SIGN_ENTITLEMENTS: InspireMe/InspireMe.entitlements
        INFOPLIST_FILE: InspireMe/Info.plist
    entitlements:
      path: InspireMe/InspireMe.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pe.kr.advenoh.inspireme
    dependencies:
      - target: InspireMeWidgetExtension

  InspireMeWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: InspireMeWidget
      - path: Shared
    info:
      path: InspireMeWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: pe.kr.advenoh.inspireme.widget
        INFOPLIST_KEY_CFBundleDisplayName: InspireMe Widget
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: InspireMeWidget/InspireMeWidget.entitlements
    entitlements:
      path: InspireMeWidget/InspireMeWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.pe.kr.advenoh.inspireme
